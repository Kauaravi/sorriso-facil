{% extends "base.html" %}

{% block titulo %}Consulta | Sorriso Fácil{% endblock %}

{% block conteudo %}

    <h2>{{ titulo }}</h2>

    <form method="POST">

        <label for="paciente_id">Paciente:</label>

        <select id="paciente_id" name="paciente_id" required>
            <option value="">Selecione um paciente</option>

            {% for paciente in pacientes %}
                <option
                    value="{{ paciente.id }}"
                    {% if consulta and consulta.paciente_id == paciente.id %}
                        selected
                    {% endif %}
                >
                    {{ paciente.nome }}
                </option>
            {% endfor %}
        </select>

        <label for="data">Data da consulta:</label>
        <input
            type="date"
            id="data"
            name="data"
            value="{{ consulta.data if consulta else '' }}"
            required
        >

        <label for="horario">Horário:</label>
        <input
            type="time"
            id="horario"
            name="horario"
            value="{{ consulta.horario if consulta else '' }}"
            required
        >

        <label for="procedimento">Procedimento:</label>
        <input
            type="text"
            id="procedimento"
            name="procedimento"
            value="{{ consulta.procedimento if consulta else '' }}"
            required
        >

        <label for="status">Status:</label>

        <select id="status" name="status" required>
            {% for opcao in ["Agendada", "Realizada", "Cancelada"] %}
                <option
                    value="{{ opcao }}"
                    {% if consulta and consulta.status == opcao %}
                        selected
                    {% elif not consulta and opcao == "Agendada" %}
                        selected
                    {% endif %}
                >
                    {{ opcao }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Salvar consulta</button>

        <a href="{{ url_for('listar_consultas') }}">Cancelar</a>

    </form>

{% endblock %}
