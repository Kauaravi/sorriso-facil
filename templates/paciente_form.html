{% extends "base.html" %}

{% block titulo %}Cadastro de paciente | Sorriso Fácil{% endblock %}

{% block conteudo %}

    <h2>{{ titulo }}</h2>

    <form method="POST">

        <label for="nome">Nome completo:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ paciente.nome if paciente else '' }}"
            required
        >

        <label for="telefone">Telefone:</label>
        <input
            type="text"
            id="telefone"
            name="telefone"
            value="{{ paciente.telefone if paciente else '' }}"
            required
        >

        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ paciente.email if paciente else '' }}"
        >

        <button type="submit">Salvar paciente</button>

        <a href="{{ url_for('listar_pacientes') }}">
            Cancelar
        </a>

    </form>

{% endblock %}
